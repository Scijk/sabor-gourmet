# ============================================================================
# Configuración de Producción - Sabor Gourmet
# ============================================================================
# NOTA: Usar variables de entorno en producción en lugar de valores hardcodeados

# Spring Boot
spring.application.name=sabor-gourmet-reservas
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/sabor-gourmet

# PostgreSQL Configuration (usar variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sabor_gourmet_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=WARN
logging.level.com.saborgourmet=INFO
logging.level.org.springframework.web=WARN
logging.file.name=logs/sabor-gourmet.log
logging.file.max-size=10MB
logging.file.max-history=10

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Development Tools
spring.devtools.restart.enabled=false

# Error Handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
