<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1>Panel de Administración - Reservas</h1>
    <div class="row mt-3">
        <div class="col-md-4">
            <h3>Pendientes</h3>
            <ul class="list-group">
                <li th:each="r : ${reservasPendientes}" class="list-group-item">
                    <a th:href="@{/reservas/{id}(id=${r.id})}" th:text="${r.cliente.nombre} + ' - ' + ${#temporals.format(r.fechaReserva,'dd/MM/yyyy HH:mm')}"></a>
                </li>
            </ul>
        </div>
        <div class="col-md-4">
            <h3>Activas</h3>
            <ul class="list-group">
                <li th:each="r : ${reservasActivas}" class="list-group-item">
                    <a th:href="@{/reservas/{id}(id=${r.id})}" th:text="${r.cliente.nombre} + ' - ' + ${#temporals.format(r.fechaReserva,'dd/MM/yyyy HH:mm')}"></a>
                </li>
            </ul>
        </div>
        <div class="col-md-4">
            <h3>Confirmadas</h3>
            <ul class="list-group">
                <li th:each="r : ${reservasConfirmadas}" class="list-group-item">
                    <a th:href="@{/reservas/{id}(id=${r.id})}" th:text="${r.cliente.nombre} + ' - ' + ${#temporals.format(r.fechaReserva,'dd/MM/yyyy HH:mm')}"></a>
                </li>
            </ul>
        </div>
    </div>
    <div class="mt-3">
        <a th:href="@{/reservas}" class="btn btn-secondary">Volver</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
