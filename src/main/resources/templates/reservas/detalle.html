<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Reserva - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1>Detalle de Reserva</h1>
    <div class="card p-4 mt-3">
        <p><strong>ID:</strong> <span th:text="${reserva.id}"></span></p>
        <p><strong>Cliente:</strong> <span th:text="${reserva.cliente.nombre}"></span></p>
        <p><strong>Mesa:</strong> <span th:text="${reserva.mesa.numeroMesa}"></span></p>
        <p><strong>Fecha:</strong> <span th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy HH:mm')}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${reserva.estado}"></span></p>
        <p><strong>Comensales:</strong> <span th:text="${reserva.numeroComensales}"></span></p>
        <p><strong>Observaciones:</strong> <span th:text="${reserva.observaciones}"></span></p>
        <div class="mt-3">
            <a th:href="@{/reservas}" class="btn btn-secondary">Volver al listado</a>
            <a th:href="@{/reservas/editar/{id}(id=${reserva.id})}" class="btn btn-warning">Editar</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
