<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reserva - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1>Editar Reserva</h1>
    <div class="card p-4 mt-3">
        <form th:action="@{/reservas/{id}(id=${reserva.id})}" method="post">
            <div class="mb-3">
                <label class="form-label">Fecha y hora</label>
                <input type="datetime-local" name="fechaReserva" class="form-control"
                       th:value="${#strings.replace(#temporals.format(reserva.fechaReserva,'yyyy-MM-dd HH:mm'),' ','T')}">
            </div>
            <div class="mb-3">
                <label class="form-label">Número de comensales</label>
                <input type="number" name="numeroComensales" class="form-control" th:value="${reserva.numeroComensales}">
            </div>
            <div class="mb-3">
                <label class="form-label">Observaciones</label>
                <textarea name="observaciones" class="form-control" rows="3" th:text="${reserva.observaciones}"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/reservas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
