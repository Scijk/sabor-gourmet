<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #d4a574;
            --secondary-color: #2c3e50;
        }

        .page-header {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #34495e 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--primary-color);
        }

        .form-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .form-group label {
            font-weight: bold;
            color: var(--secondary-color);
        }

        .form-control {
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(212, 165, 116, 0.25);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: #c9935d;
            border-color: #c9935d;
        }

        .invalid-feedback {
            display: block;
        }
    </style>
</head>
<body style="background-color: #f5f5f5;">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, var(--secondary-color) 0%, #34495e 100%); box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <div class="container-fluid">
            <a class="navbar-brand" href="/sabor-gourmet/">
                <i class="fas fa-utensils" style="color: var(--primary-color);"></i> Sabor Gourmet
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/sabor-gourmet/">
                            <i class="fas fa-home"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reservas}">
                            <i class="fas fa-calendar-alt"></i> Reservas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/clientes}">
                            <i class="fas fa-users"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/mesas}">
                            <i class="fas fa-table"></i> Mesas
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 th:if="${cliente.id == null}">
                <i class="fas fa-user-plus"></i> Nuevo Cliente
            </h1>
            <h1 th:if="${cliente.id != null}">
                <i class="fas fa-user-edit"></i> Editar Cliente
            </h1>
            <p class="mb-0">Completa la información del cliente</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="row">
            <div class="col-lg-6 offset-lg-3">
                <div class="form-card">
                    <form th:method="${cliente.id == null ? 'post' : 'post'}"
                          th:action="${cliente.id == null} ? @{/clientes} : @{/clientes/{id}(id=${cliente.id})}"
                          method="post" th:object="${cliente}">
                        
                        <div class="form-group mb-3">
                            <label for="nombre">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" 
                                   th:field="*{nombre}" required
                                   th:classappend="${#fields.hasErrors('nombre') ? 'is-invalid' : ''}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}">
                                <span th:errors="*{nombre}"></span>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email">Email *</label>
                            <input type="email" class="form-control" id="email" 
                                   th:field="*{email}" required
                                   th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                                <span th:errors="*{email}"></span>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="telefono">Teléfono *</label>
                            <input type="text" class="form-control" id="telefono" 
                                   th:field="*{telefono}" placeholder="3001234567" required
                                   th:classappend="${#fields.hasErrors('telefono') ? 'is-invalid' : ''}">
                            <small class="text-muted">Formato: 10 dígitos</small>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}">
                                <span th:errors="*{telefono}"></span>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="notas">Notas</label>
                            <textarea class="form-control" id="notas" 
                                     th:field="*{notas}" rows="4" 
                                     placeholder="Información adicional del cliente..."></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> 
                                <span th:if="${cliente.id == null}">Crear Cliente</span>
                                <span th:if="${cliente.id != null}">Actualizar Cliente</span>
                            </button>
                            <a th:href="@{/clientes}" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="background-color: var(--secondary-color); color: #ecf0f1; padding: 20px 0; margin-top: 40px; text-align: center; border-top: 3px solid var(--primary-color);">
        <div class="container-fluid">
            <p class="mb-0">
                <i class="fas fa-copyright"></i> Sabor Gourmet - Sistema de Reservas
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
