<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Cliente - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1><i class="fas fa-user"></i> Detalle de Cliente</h1>
        <div class="card p-4 mt-3">
            <p><strong>ID:</strong> <span th:text="${cliente.id}"></span></p>
            <p><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></p>
            <p><strong>Email:</strong> <span th:text="${cliente.email}"></span></p>
            <p><strong>Teléfono:</strong> <span th:text="${cliente.telefono}"></span></p>
            <p><strong>Notas:</strong> <span th:text="${cliente.notas}"></span></p>
            <div class="mt-3">
                <a th:href="@{/clientes}" class="btn btn-secondary">Volver al listado</a>
                <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-warning">Editar</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
