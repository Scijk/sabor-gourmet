<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Mesa - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1>Detalle de Mesa</h1>
    <div class="card p-4 mt-3">
        <p><strong>ID:</strong> <span th:text="${mesa.id}"></span></p>
        <p><strong>Número:</strong> <span th:text="${mesa.numeroMesa}"></span></p>
        <p><strong>Capacidad:</strong> <span th:text="${mesa.capacidad}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${mesa.estado}"></span></p>
        <div class="mt-3">
            <a th:href="@{/mesas}" class="btn btn-secondary">Volver al listado</a>
            <a th:href="@{/mesas/editar/{id}(id=${mesa.id})}" class="btn btn-warning">Editar</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
