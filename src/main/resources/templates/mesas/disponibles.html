<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas Disponibles - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1>Mesas Disponibles</h1>
    <div class="card mt-3 p-3">
        <table class="table">
            <thead><tr><th>ID</th><th>Número</th><th>Capacidad</th><th>Acciones</th></tr></thead>
            <tbody>
                <tr th:each="mesa : ${mesas}">
                    <td th:text="${mesa.id}"></td>
                    <td th:text="${mesa.numeroMesa}"></td>
                    <td th:text="${mesa.capacidad}"></td>
                    <td>
                        <a th:href="@{/mesas/{id}(id=${mesa.id})}" class="btn btn-sm btn-info">Ver</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <a th:href="@{/mesas}" class="btn btn-secondary">Volver al listado</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
